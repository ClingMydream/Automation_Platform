services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    deploy:
      resources:
        limits:
          memory: 768M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - transfer-data:/tmp/automation-platform-transfers
      - learning-data:/var/lib/cling-learning
      - test-package-data:/var/lib/cling-test-packages
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      emote-preview:
        condition: service_healthy
      jenkins:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  emote-preview:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - emote-preview-data:/usr/share/nginx/html:ro
      - /opt/emote-preview/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 64M

  jenkins:
    build:
      context: .
      dockerfile: deploy/jenkins/Dockerfile
    restart: unless-stopped
    environment:
      JENKINS_OPTS: --prefix=/jenkins
      JAVA_OPTS: -Xms256m -Xmx768m -Djenkins.install.runSetupWizard=false -Duser.language=zh -Duser.country=CN
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-cling}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      CODEUP_USERNAME: ${CODEUP_USERNAME}
      CODEUP_PASSWORD: ${CODEUP_PASSWORD}
      JENKINS_PUBLISH_TOKEN: ${JENKINS_PUBLISH_TOKEN}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx1024m -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false
    volumes:
      - jenkins-data:/var/jenkins_home
      - emote-preview-data:/srv/emote-preview
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/jenkins/login"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  mysql-data:
  transfer-data:
  learning-data:
  test-package-data:
  jenkins-data:
  emote-preview-data:
